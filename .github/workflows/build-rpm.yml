name: Build RPM (CentOS 6 / 7 / Rocky Linux 8 / 9 / 10)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Source1 的上游地址 www.jmknoble.net 现已位于 Cloudflare 挑战页之后，CI 无法下载。
  # 改用 Fedora 归档中同一份 x11-ssh-askpass tarball，并用 md5 校验完整性。
  ASKPASS_TARBALL: x11-ssh-askpass-1.2.4.1.tar.gz
  ASKPASS_MD5: 8f2e41f3f7eaa8543a2440454637f3c3

jobs:
  # Rocky 8 / 9：镜像的 glibc 够新，可直接使用 job 级 container
  build:
    name: Build RPM on Rocky Linux (${{ matrix.os }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: el8
            image: rockylinux:8
            crb: powertools
            # imake(xmkmf) 由 el8 的 CRB 仓库提供
            epel: false
          - os: el9
            image: rockylinux:9
            crb: crb
            # RHEL9 移除了 imake，改从 EPEL 获取（imake-1.0.8-6.el9）
            epel: true
          - os: el10
            image: rockylinux/rockylinux:10
            crb: crb
            # RHEL10 把 imake 和 gtk2-devel 都移除了，两者均由 EPEL 10 提供
            # （imake-1.0.10、gtk2-devel-2.24.33）
            epel: true
    env:
      # RPM 构建树根目录（%_topdir），放在 workspace 内便于收集产物
      TOPDIR: ${{ github.workspace }}/rpmbuild
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable CRB/EPEL repos and install build dependencies
        run: |
          set -eux
          dnf -y install dnf-plugins-core
          # -devel 类包位于 CRB 仓库（el8 中名为 powertools，el9 中名为 crb）
          dnf config-manager --set-enabled ${{ matrix.crb }} || dnf config-manager --set-enabled crb
          if [ "${{ matrix.epel }}" = "true" ]; then
            dnf -y install epel-release
          fi
          # 说明：spec 的 BuildRequires 写了 /bin/login，而 Rocky 的 rpmdb 只提供
          # /usr/bin/login，`dnf builddep` 会因该依赖无法解析而整体失败，
          # 因此这里按 spec 逐项安装等价依赖（rpmbuild 自身的依赖检查可通过）。
          dnf -y install \
            rpm-build make gcc \
            perl openssl-devel krb5-devel pam-devel \
            glibc-devel libXt-devel gtk2-devel pkgconf-pkg-config \
            util-linux tar gzip
          # x11-ssh-askpass 用 xmkmf(imake) 构建：el8 来自 CRB，el9/el10 来自 EPEL
          # 基础镜像自带 curl（el9/el10 为 curl-minimal），不能再装 curl 以免依赖冲突
          dnf -y install imake

      - name: Fetch sources
        id: source
        run: |
          set -eux
          VERSION="$(rpmspec -q --qf '%{version}\n' openssh.spec | head -n1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p "$TOPDIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp openssh.spec "$TOPDIR/SPECS/"

          # Source0: openssh-<version>.tar.gz
          curl -fSL --retry 3 --retry-delay 2 \
            -o "$TOPDIR/SOURCES/openssh-$VERSION.tar.gz" \
            "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-$VERSION.tar.gz"

          # Source1: x11-ssh-askpass（Fedora lookaside 归档）
          curl -fSL --retry 3 --retry-delay 2 \
            -o "$TOPDIR/SOURCES/$ASKPASS_TARBALL" \
            "https://src.fedoraproject.org/lookaside/pkgs/openssh/$ASKPASS_TARBALL/$ASKPASS_MD5/$ASKPASS_TARBALL"
          echo "$ASKPASS_MD5  $TOPDIR/SOURCES/$ASKPASS_TARBALL" | md5sum -c -

      - name: Build RPM
        run: |
          set -o pipefail
          rpmbuild -ba --define "_topdir $TOPDIR" "$TOPDIR/SPECS/openssh.spec" 2>&1 | tee /tmp/rpmbuild.log

      - name: Show built packages
        run: |
          set -eux
          rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\t%{SIZE} bytes\n' "$TOPDIR"/RPMS/*/*.rpm

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: openssh-${{ steps.source.outputs.version }}-${{ matrix.os }}.x86_64
          path: |
            rpmbuild/RPMS/*/*.rpm
            rpmbuild/SRPMS/*.rpm
          if-no-files-found: error
          retention-days: 14

  # CentOS 6/7：镜像的 glibc 过旧（2.12/2.17），跑不了 node20 版的 action
  # （checkout / upload-artifact），因此不能用 job 级 container，
  # 改为起一个常驻容器，用 docker exec 逐步执行。
  build-legacy:
    name: Build RPM on CentOS (${{ matrix.os }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: el6
            image: centos:6
            vault: 6.10
            # el6 官方仓库没有 openssl 1.1.1（OpenSSH 9.x+ 要求），
            # spec 会对 rhel<=6 自动走 --without-openssl 分支（仅支持
            # ed25519 等不依赖 OpenSSL 的算法），无需 EPEL / openssl11
            epel: false
            openssl_pkg: ""
            # centos:6 极简镜像不带 /bin/login（属于 util-linux-ng），
            # 而 spec 的 BuildRequires 写了 /bin/login，必须补装
            login_pkg: util-linux-ng
          - os: el7
            image: centos:7
            vault: 7.9.2009
            # spec 的 %if 0%{?rhel} == 7 分支需要 openssl11-devel(>= 1.1.1)，
            # 仅存在于已归档的 EPEL 7
            epel: true
            openssl_pkg: openssl11-devel
            login_pkg: ""
    env:
      # 构建树放在容器外挂载的 /tmp 下，避免 root 在 workspace 里留下属主为 root 的文件
      TOPDIR: /tmp/rpmbuild
      BUILDER: legacy-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build tree
        run: |
          set -eux
          mkdir -p "$TOPDIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp openssh.spec "$TOPDIR/SPECS/"

      - name: Start build container
        run: |
          set -eux
          docker run -d --name "$BUILDER" -v "$TOPDIR:$TOPDIR" ${{ matrix.image }} sleep infinity

      - name: Configure repos and install build dependencies
        run: |
          set -eux
          docker exec -i \
            -e VAULT_VER="${{ matrix.vault }}" \
            -e EPEL="${{ matrix.epel }}" \
            -e OPENSSL_PKG="${{ matrix.openssl_pkg }}" \
            -e LOGIN_PKG="${{ matrix.login_pkg }}" \
            "$BUILDER" bash -s <<'EOS'
          set -eux
          # CentOS 已 EOL，官方 mirrorlist 失效，需切换到 vault 镜像
          VAULT=""
          for m in https://mirrors.aliyun.com/centos-vault/$VAULT_VER \
                   https://mirrors.ustc.edu.cn/centos-vault/$VAULT_VER \
                   https://repo.huaweicloud.com/centos-vault/$VAULT_VER \
                   https://mirror.nsc.liu.se/centos-store/$VAULT_VER; do
            if curl -fsSL --max-time 20 -o /dev/null "$m/os/x86_64/repodata/repomd.xml"; then
              VAULT="$m"
              break
            fi
          done
          [ -n "$VAULT" ] || { echo "no usable CentOS vault mirror"; exit 1; }
          sed -i -e 's|^mirrorlist=|#mirrorlist=|' \
            -e "s|^#baseurl=http://mirror.centos.org/centos/\$releasever|baseurl=$VAULT|" \
            /etc/yum.repos.d/CentOS-Base.repo

          if [ "$EPEL" = "true" ]; then
            # EPEL 7 同样已归档
            yum -y install epel-release
            sed -i -e 's|^metalink=|#metalink=|' \
              -e 's|^#baseurl=https\?://download.fedoraproject.org/pub/epel/|baseurl=https://archives.fedoraproject.org/pub/archive/epel/|' \
              -e 's|^gpgkey=.*|gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-7|' \
              /etc/yum.repos.d/epel*.repo
            rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-7
          fi

          # 说明：spec 的 BuildRequires 写了 /bin/login，`yum-builddep` 会因该依赖
          # 无法解析而整体失败，因此这里按 spec 逐项安装等价依赖。
          PKGS=(rpm-build make gcc perl krb5-devel pam-devel \
            glibc-devel libXt-devel gtk2-devel pkgconfig imake tar gzip)
          [ -n "$OPENSSL_PKG" ] && PKGS+=("$OPENSSL_PKG")
          [ -n "$LOGIN_PKG" ] && PKGS+=("$LOGIN_PKG")
          yum -y install "${PKGS[@]}"
          EOS

      - name: Fetch sources
        id: source
        run: |
          set -eux
          # el6 的 rpm(4.8) 没有 rpmspec 命令，直接从 spec 文本解析版本号
          VERSION="$(sed -n 's/^%global ver[[:space:]][[:space:]]*\([^[:space:]]*\).*/\1/p' openssh.spec | head -n1)"
          [ -n "$VERSION" ] || { echo "cannot parse version from openssh.spec"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          docker exec -i -e TOPDIR="$TOPDIR" -e VERSION="$VERSION" \
            -e ASKPASS_TARBALL="$ASKPASS_TARBALL" -e ASKPASS_MD5="$ASKPASS_MD5" \
            "$BUILDER" bash -s <<'EOS'
          set -eux
          # Source0
          curl -fSL --retry 3 --retry-delay 2 \
            -o "$TOPDIR/SOURCES/openssh-$VERSION.tar.gz" \
            "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-$VERSION.tar.gz"
          # Source1: x11-ssh-askpass（Fedora lookaside 归档）
          curl -fSL --retry 3 --retry-delay 2 \
            -o "$TOPDIR/SOURCES/$ASKPASS_TARBALL" \
            "https://src.fedoraproject.org/lookaside/pkgs/openssh/$ASKPASS_TARBALL/$ASKPASS_MD5/$ASKPASS_TARBALL"
          echo "$ASKPASS_MD5  $TOPDIR/SOURCES/$ASKPASS_TARBALL" | md5sum -c -
          EOS

      - name: Build RPM
        run: |
          set -eux
          docker exec -e TOPDIR="$TOPDIR" "$BUILDER" \
            rpmbuild -ba --define "_topdir $TOPDIR" "$TOPDIR/SPECS/openssh.spec"

      - name: Show built packages
        run: |
          set -eux
          docker exec -i -e TOPDIR="$TOPDIR" "$BUILDER" bash -s <<'EOS'
          rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\t%{SIZE} bytes\n' "$TOPDIR"/RPMS/*/*.rpm
          EOS

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: openssh-${{ steps.source.outputs.version }}-${{ matrix.os }}.x86_64
          path: |
            /tmp/rpmbuild/RPMS/*/*.rpm
            /tmp/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker rm -f "$BUILDER" || true

  # 仅在推送 v* 标签时执行：收集所有构建 job 的产物并推送到 packagecloud.io
  release:
    name: Push RPMs to packagecloud.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-legacy]
    runs-on: ubuntu-24.04
    env:
      PACKAGECLOUD_REPO: wuwx/openssh
    steps:
      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openssh-*
          merge-multiple: true
          path: artifacts

      - name: Install packagecloud CLI
        run: sudo gem install package_cloud --no-document

      - name: Push RPMs to packagecloud
        env:
          # package_cloud CLI 直接读取该环境变量
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: |
          set -eux
          shopt -s nullglob
          rpms=(artifacts/RPMS/*/*.rpm artifacts/SRPMS/*.rpm)
          [ ${#rpms[@]} -gt 0 ] || { echo "no RPMs found"; exit 1; }
          # 从文件名里的 dist tag（.el6/.el7/...）推断目标发行版仓库，
          # 各构建 job 的 artifact 内部结构一致：RPMS/<arch>/*.rpm 与 SRPMS/*.rpm
          for rpm in "${rpms[@]}"; do
            # debuginfo 包对软件源使用者没有意义，不推送
            case "$rpm" in *debuginfo*) continue ;; esac
            if [[ $rpm =~ \.el([0-9]+)\. ]]; then
              package_cloud push "$PACKAGECLOUD_REPO/el/${BASH_REMATCH[1]}" "$rpm"
            else
              echo "skip (no dist tag): $rpm" >&2
            fi
          done
